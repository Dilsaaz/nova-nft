<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Bitwave Global</title>
</head>

<body style="margin:0;font-family:Arial;background:#0b0f1a;color:white;">

<!-- HEADER -->
<div style="padding:15px;background:#111;color:gold;font-weight:bold;">
BITWAVE GLOBAL
</div>

<!-- HOME -->
<div style="padding:20px;">

<h2>AI Trading Platform</h2>
<p>Live Crypto Market</p>

<div style="margin-top:20px;padding:10px;background:#111;">
Minimum Deposit: $250<br>
Withdraw Time: 24 Hours<br>
Daily Profit: 10% - 15%
</div>

<br>

<div id="price" style="padding:10px;background:#222;">
Loading market...
</div>

<br>

<button onclick="goTelegram()" style="padding:10px;background:#2b6fff;color:white;border:none;">
Join Telegram
</button>

</div>

<script>

/* SIMPLE WORKING PRICE */
async function load(){
try{
let r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin&vs_currencies=usd");
let d = await r.json();

document.getElementById("price").innerHTML =
"BTC: $" + d.bitcoin.usd +
" | ETH: $" + d.ethereum.usd +
" | BNB: $" + d.binancecoin.usd;

}catch(e){
document.getElementById("price").innerHTML="Market loading error";
}
}

load();

/* TELEGRAM */
function goTelegram(){
window.open("https://t.me/Bitwave1");
}

</script>

</body>
</html>
